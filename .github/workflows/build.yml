name: Build app packages

on:
  push:
    branches: [ci-android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zgj-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK 28.2.13676358
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK"
          ls -1 "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "using sdkmanager: $SM"
          test -n "$SM"
          printf 'y\ny\ny\ny\ny\ny\ny\ny\n' | "$SM" --install 'ndk;28.2.13676358'
          echo "--- installed ndk ---"
          ls -1 "$SDK/ndk"
      - name: Build all-sources ARM64 APK
        run: python scripts/build_android.py --all-sources --abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
